# Minimal 32 KB LoROM linker config for the mid-line-raster cross-check ROM.
MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    ROM:      start = $8000, size = $8000, type = ro, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:    load = ROM, start = $8000, type = ro;
    HEADER:  load = ROM, start = $ffc0, type = ro;
    VECTORS: load = ROM, start = $ffe0, type = ro;
}
