# Gradle properties for the Android shell.
#
# This file was MISSING from the repository until `v1.30.0`, and its absence made the app
# unbuildable from a clean checkout: `:app:checkDebugAarMetadata` fails outright with
# "contains AndroidX dependencies, but the `android.useAndroidX` property is not enabled".
# Every previous Android build in this project ran on a machine that already had these settings
# somewhere Gradle could see them (a user-level `~/.gradle/gradle.properties`), so nothing ever
# surfaced the gap. `android.yml`'s first green run is what found it.

# Required: every dependency in `app/build.gradle.kts` is AndroidX (Compose, activity-compose,
# core-ktx). Without this, AGP refuses the build rather than risking a support-library collision.
android.useAndroidX=true

# Not needed and deliberately off: Jetifier rewrites *legacy* support-library artifacts, and this
# project has none. Leaving it on costs build time on every dependency for no effect.
android.enableJetifier=false

kotlin.code.style=official

# The Kotlin/Compose compiler needs more heap than Gradle's 512 MB default; a CI runner otherwise
# fails with an OOM inside the Kotlin daemon rather than a legible error.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
